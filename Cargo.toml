[package]
name = "happynum"
version = "1.7.2"
authors = ["Josh Jones <ohblonddev@gmail.com>"]
edition = "2024"
license = "MIT"
description = "Distinct happy number finder"
readme = "README.md"
repository = "https://github.com/jjmark15/happynum_rust"
keywords = ["happy", "number"]
categories = ["science"]
exclude = [".gitignore"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rayon = { version = "1.11" }

# generated by 'cargo dist init'
[profile.dist]
inherits = "release"
debug = true
split-debuginfo = "packed"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "my_benchmark"
harness = false

[profile.release]
strip = "debuginfo"
